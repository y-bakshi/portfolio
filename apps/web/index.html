<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yash Bakshi, software engineer. AI applications, backend systems and cloud delivery."
    />
    <link rel="canonical" href="%SITE%/" />
    <meta name="theme-color" content="#e8e0d2" />
    <!-- the portrait is the first thing drawn, so it starts downloading before the scripts have run -->
    <link
      rel="preload"
      as="image"
      href="/portrait-760.webp"
      type="image/webp"
      media="(max-width: 900px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/portrait.webp"
      type="image/webp"
      media="(min-width: 901px)"
      fetchpriority="high"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yash Bakshi" />
    <meta
      property="og:description"
      content="Software engineer working across AI applications, backend services and cloud delivery."
    />
    <meta property="og:image" content="%SITE%/og.png" />
    <meta property="og:url" content="%SITE%/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Yash Bakshi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
